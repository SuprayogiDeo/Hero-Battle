let AC,MG,DL,muted=false;const SMP={},MUS={};let curM='',mSrc=null;
const SN=['arrow','arrowhit','fire','explode','sword','slash','spear','ice','dark','poison','heal','shield','magic','hurt','kill','portal','coin','click','hit','cast','clear','slam','parry','limit','boss'];
function ld(n,s2,u){fetch(u).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>AC.decodeAudioData(b)).then(d=>{s2[n]=d;if(s2===MUS&&n==curM){curM='';playM(n)}}).catch(()=>{})}
function au(){if(AC)return AC;AC=new(window.AudioContext||webkitAudioContext)();MG=AC.createGain();MG.gain.value=muted?0:.8;const cp=AC.createDynamicsCompressor();MG.connect(cp);cp.connect(AC.destination);DL=AC.createDelay();DL.delayTime.value=.24;const fb=AC.createGain();fb.gain.value=.3;DL.connect(fb);fb.connect(DL);const w=AC.createGain();w.gain.value=.28;DL.connect(w);w.connect(cp);SN.forEach(n=>ld(n,SMP,'audio/'+n+'.ogg'));['title','battle'].forEach(n=>ld(n,MUS,'audio/'+n+'.ogg'));return AC}
function playM(n){if(curM==n&&mSrc)return;curM=n;if(mSrc){try{mSrc.stop()}catch(e){}mSrc=null}const b=MUS[n];if(!b||!AC)return;mSrc=AC.createBufferSource();mSrc.buffer=b;mSrc.loop=true;const q=AC.createGain();q.gain.value=.45;mSrc.connect(q);q.connect(MG);mSrc.start()}
function tone(f,d,ty,v,o){o=o||{};const c=au(),n=c.currentTime+(o.at||0),os=c.createOscillator(),a=c.createGain(),fl=c.createBiquadFilter();os.type=ty;os.frequency.setValueAtTime(f,n);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,n+d);fl.type='lowpass';fl.frequency.value=o.lp||5000;a.gain.setValueAtTime(.0001,n);a.gain.linearRampToValueAtTime(v,n+(o.atk||.005));a.gain.exponentialRampToValueAtTime(.0001,n+d);os.connect(fl);fl.connect(a);a.connect(MG);if(o.dl)a.connect(DL);os.start(n);os.stop(n+d+.05)}
function nz(d,v,fr,q,o){o=o||{};const c=au(),n=c.currentTime+(o.at||0),b=c.createBuffer(1,(c.sampleRate*d|0)||1,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=q;f.frequency.setValueAtTime(fr,n);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,n+d);const g2=c.createGain();g2.gain.setValueAtTime(v,n);g2.gain.exponentialRampToValueAtTime(.0001,n+d);s.connect(f);f.connect(g2);g2.connect(MG);s.start(n)}
